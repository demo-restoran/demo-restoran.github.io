<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07140f">
<title>Отметка на работе</title>
<style>
  :root {
    --bg1:#04100b; --bg2:#0b2a1e; --glass:rgba(255,255,255,.07); --glass-b:rgba(255,255,255,.14);
    --ink:#f3f1ea; --muted:#a9b8b0; --mint:#3ee6a0; --mint2:#17b877; --coral:#ff6b57; --coral2:#d8402d; --gold:#ffcf5a;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink);
    background:radial-gradient(120% 80% at 50% 0%, var(--bg2) 0%, var(--bg1) 60%) fixed; overflow-x:hidden;
  }

  /* ---------- 3D-фон ---------- */
  .scene { position:fixed; inset:0; perspective:900px; pointer-events:none; overflow:hidden; z-index:0; }
  .ring { position:absolute; left:50%; top:38%; border-radius:50%; transform-style:preserve-3d;
          border:2px solid rgba(62,230,160,.28); box-shadow:0 0 30px rgba(62,230,160,.15), inset 0 0 30px rgba(62,230,160,.08); }
  .r1 { width:520px; height:520px; margin:-260px; animation:spin1 22s linear infinite; }
  .r2 { width:380px; height:380px; margin:-190px; border-color:rgba(255,207,90,.25); animation:spin2 17s linear infinite; }
  .r3 { width:680px; height:680px; margin:-340px; border-color:rgba(255,255,255,.08); border-style:dashed; animation:spin3 34s linear infinite; }
  @keyframes spin1 { from { transform:rotateX(70deg) rotateZ(0) } to { transform:rotateX(70deg) rotateZ(360deg) } }
  @keyframes spin2 { from { transform:rotateY(65deg) rotateZ(0) } to { transform:rotateY(65deg) rotateZ(-360deg) } }
  @keyframes spin3 { from { transform:rotateX(60deg) rotateY(20deg) rotateZ(0) } to { transform:rotateX(60deg) rotateY(20deg) rotateZ(360deg) } }
  .orb { position:absolute; border-radius:50%; filter:blur(2px); opacity:.55;
         background:radial-gradient(circle at 30% 30%, #fff 0%, var(--mint) 25%, transparent 70%); animation:float 14s ease-in-out infinite; }
  .o1 { width:90px; height:90px; left:8%; top:62%; }
  .o2 { width:50px; height:50px; right:12%; top:20%; animation-delay:-5s; background:radial-gradient(circle at 30% 30%, #fff 0%, var(--gold) 25%, transparent 70%); }
  .o3 { width:130px; height:130px; right:-30px; bottom:8%; animation-delay:-9s; opacity:.35; }
  @keyframes float { 0%,100% { transform:translate3d(0,0,0) scale(1) } 50% { transform:translate3d(20px,-40px,80px) scale(1.15) } }

  /* ---------- шапка с часами ---------- */
  header { position:relative; z-index:1; text-align:center; padding:28px 16px 10px; }
  header h1 { margin:0 0 10px; font-size:16px; font-weight:600; letter-spacing:.5px; color:var(--muted); text-transform:uppercase; }
  .clock { display:inline-flex; gap:5px; align-items:center; perspective:400px; }
  .digit { position:relative; width:42px; height:60px; border-radius:10px; font-size:42px; font-weight:800; line-height:60px; text-align:center;
           font-variant-numeric:tabular-nums; color:#fff;
           background:linear-gradient(180deg, rgba(255,255,255,.14) 0 50%, rgba(255,255,255,.07) 50% 100%);
           border:1px solid var(--glass-b); box-shadow:0 10px 25px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.2);
           transform-style:preserve-3d; }
  .digit::after { content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.35); }
  .digit.flip { animation:flip .45s cubic-bezier(.3,1.4,.6,1); }
  @keyframes flip { 0% { transform:rotateX(-90deg); opacity:.2 } 100% { transform:rotateX(0); opacity:1 } }
  .digit.small { width:30px; height:44px; font-size:28px; line-height:44px; }
  .colon { font-size:36px; font-weight:800; color:var(--mint); animation:blink 1s steps(1) infinite; padding:0 1px; }
  @keyframes blink { 50% { opacity:.25 } }
  #date { margin-top:12px; font-size:15px; color:var(--ink); opacity:.85; }
  .tz { font-size:12px; color:var(--muted); margin-top:3px; }

  /* ---------- 3D-карточка ---------- */
  main { position:relative; z-index:1; max-width:440px; margin:14px auto 0; padding:0 16px 40px; perspective:1200px; }
  .tilt { transform-style:preserve-3d; transition:transform .25s ease-out; will-change:transform; }
  .flipper { display:grid; transform-style:preserve-3d; transition:transform .9s cubic-bezier(.2,.8,.2,1.15); }
  .flipper.flipped { transform:rotateY(180deg); }
  .face { grid-area:1/1; backface-visibility:hidden; -webkit-backface-visibility:hidden; transform-style:preserve-3d;
          background:linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
          border:1px solid var(--glass-b); border-radius:22px; padding:22px;
          box-shadow:0 30px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18);
          backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .face.back { transform:rotateY(180deg); }
  .face > * { backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .lift { transform:translateZ(40px); }
  .lift2 { transform:translateZ(70px); }
  .shake { animation:shake .5s; }
  .face.back.shake { animation:shakeBack .5s; }
  @keyframes shake { 20%,60% { transform:translateX(-10px) rotateY(-6deg) } 40%,80% { transform:translateX(10px) rotateY(6deg) } }
  @keyframes shakeBack { 0%,100% { transform:rotateY(180deg) } 20%,60% { transform:rotateY(174deg) translateX(10px) } 40%,80% { transform:rotateY(186deg) translateX(-10px) } }

  label { display:block; font-size:13px; color:var(--muted); margin:0 0 6px; }
  select, input { width:100%; font-size:18px; padding:14px; border:1px solid var(--glass-b); border-radius:12px; color:var(--ink);
                  background:rgba(0,0,0,.25); margin-bottom:14px; outline:none; transition:border-color .2s, box-shadow .2s; }
  select option { color:#111; }
  select:focus, input:focus { border-color:var(--mint); box-shadow:0 0 0 4px rgba(62,230,160,.18); }
  input { letter-spacing:8px; text-align:center; }

  /* объёмные кнопки */
  .btn3d { position:relative; width:100%; border:0; padding:0; background:transparent; cursor:pointer; font:inherit; margin-bottom:6px; }
  .btn3d .edge { position:absolute; inset:0; border-radius:16px; background:var(--shade, #0e7d52); transform:translateY(6px); }
  .btn3d .front { position:relative; display:block; padding:16px; border-radius:16px; font-size:18px; font-weight:700; color:#04140d;
                  background:linear-gradient(180deg, var(--c1, var(--mint)), var(--c2, var(--mint2)));
                  transform:translateY(0); transition:transform .12s; box-shadow:inset 0 1px 0 rgba(255,255,255,.5); }
  .btn3d:hover .front { transform:translateY(-2px); }
  .btn3d:active .front { transform:translateY(5px); }
  .btn3d:disabled { opacity:.55; cursor:default; }
  .btn3d.big .front { font-size:25px; padding:28px 16px; }
  .btn3d.out { --c1:#ff8a73; --c2:var(--coral); --shade:#9e2a1c; }
  .btn3d.out .front { color:#fff; }
  .pulse::before { content:""; position:absolute; inset:-6px; border-radius:22px; border:2px solid var(--glow, var(--mint)); opacity:0; animation:pulse 2.2s ease-out infinite; }
  .btn3d.out.pulse::before { --glow:var(--coral); }
  @keyframes pulse { 0% { transform:scale(.96); opacity:.7 } 100% { transform:scale(1.08); opacity:0 } }

  .btn3d.brk { --c1:#ffe08a; --c2:var(--gold); --shade:#a87a16; }
  .btn3d.brk .front { color:#3a2900; }
  .btn3d.brk.pulse::before { --glow:var(--gold); }
  .btn3d.mid .front { font-size:19px; padding:16px; }
  .actions { display:flex; flex-direction:column; gap:14px; }
  .timer { font-variant-numeric:tabular-nums; font-size:32px; font-weight:800; letter-spacing:1px; margin:0 0 4px; color:#fff; }
  .timer small { font-size:13px; font-weight:500; color:var(--muted); letter-spacing:0; display:block; }
  .cardBtn { width:100%; margin-top:16px; padding:13px; border-radius:14px; border:1px solid var(--glass-b); background:rgba(255,255,255,.07);
             color:var(--ink); font-size:16px; font-weight:600; cursor:pointer; transition:transform .15s, background .15s; }
  .cardBtn:hover { background:rgba(255,255,255,.12); transform:translateY(-2px); }
  .dot.brk { background:var(--gold); box-shadow:0 0 0 0 rgba(255,207,90,.7); animation:pingG 1.6s infinite; }
  @keyframes pingG { 70% { box-shadow:0 0 0 10px rgba(255,207,90,0) } 100% { box-shadow:0 0 0 0 rgba(255,207,90,0) } }
  .coin.brk .side { background:radial-gradient(circle at 35% 30%, #fffbe8, var(--gold) 45%, #b8861a 100%); }
  .link { margin-top:14px; width:100%; background:none; border:0; color:var(--muted); font-size:14px; padding:8px; cursor:pointer; }
  .hello { font-size:22px; font-weight:700; margin:0 0 4px; }
  .status { color:var(--muted); margin:0 0 20px; font-size:15px; display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); flex:none; }
  .dot.on { background:var(--mint); box-shadow:0 0 0 0 rgba(62,230,160,.7); animation:ping 1.6s infinite; }
  @keyframes ping { 70% { box-shadow:0 0 0 10px rgba(62,230,160,0) } 100% { box-shadow:0 0 0 0 rgba(62,230,160,0) } }
  .msg { padding:14px; border-radius:12px; font-size:15px; margin-top:16px; display:none; line-height:1.45; border:1px solid transparent; }
  .msg.ok { background:rgba(62,230,160,.12); border-color:rgba(62,230,160,.35); display:block; }
  .msg.err { background:rgba(255,107,87,.12); border-color:rgba(255,107,87,.4); color:#ffd4cc; display:block; }
  .msg.info { background:rgba(255,255,255,.07); border-color:var(--glass-b); display:block; }
  .msg.ok, .msg.err, .msg.info { animation:rise .4s ease-out; }
  @keyframes rise { from { opacity:0; transform:translateY(10px) rotateX(-20deg) } to { opacity:1; transform:none } }
  .geo { font-size:13px; color:var(--muted); margin-top:16px; text-align:center; line-height:1.5; }
  a { color:var(--mint); }

  /* ---------- 3D-монета успеха ---------- */
  .win { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; flex-direction:column;
         background:rgba(2,10,7,.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); perspective:800px; animation:fadein .2s; }
  @keyframes fadein { from { opacity:0 } }
  .coin { width:150px; height:150px; position:relative; transform-style:preserve-3d; animation:coin 1.6s cubic-bezier(.2,.7,.3,1) forwards; }
  .coin .side { position:absolute; inset:0; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:72px; font-weight:900;
                backface-visibility:hidden; -webkit-backface-visibility:hidden;
                background:radial-gradient(circle at 35% 30%, #fff8d8, var(--gold) 45%, #c9921f 100%);
                box-shadow:inset 0 0 0 8px rgba(255,255,255,.35), 0 20px 50px rgba(255,207,90,.45); color:#5a3d00; }
  .coin .side.b { transform:rotateY(180deg); }
  .coin.out .side { background:radial-gradient(circle at 35% 30%, #ffe2dc, var(--coral) 45%, #a92f1f 100%); box-shadow:inset 0 0 0 8px rgba(255,255,255,.3), 0 20px 50px rgba(255,107,87,.45); color:#fff; }
  @keyframes coin { 0% { transform:translateY(120px) rotateY(0) scale(.3) } 60% { transform:translateY(-10px) rotateY(900deg) scale(1.1) } 100% { transform:translateY(0) rotateY(1080deg) scale(1) } }
  .win p { margin:26px 0 0; font-size:22px; font-weight:700; animation:rise .5s .6s both; }
  .conf { position:fixed; top:45%; left:50%; width:10px; height:16px; border-radius:2px; z-index:51; pointer-events:none; animation:boom 1.4s ease-out forwards; }
  @keyframes boom { to { transform:translate3d(var(--x), var(--y), 0) rotateX(var(--r)) rotateZ(var(--r)); opacity:0 } }

  .hidden { display:none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="ring r3"></div><div class="ring r1"></div><div class="ring r2"></div>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
</div>

<header>
  <h1 id="rname">Ресторан</h1>
  <div class="clock" id="clock" aria-live="off"></div>
  <div id="date">&nbsp;</div>
  <div class="tz">Время Самарканда · UTC+5</div>
</header>

<main>
  <div class="tilt" id="tilt">
    <div class="flipper" id="flipper">
      <!-- лицевая сторона: вход -->
      <section class="face front" id="login">
        <div class="lift">
          <label for="emp">Сотрудник</label>
          <select id="emp"><option value="">Загрузка…</option></select>
          <label for="pin">PIN-код</label>
          <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="••••">
          <button class="btn3d" id="enter"><span class="edge"></span><span class="front">Войти</span></button>
          <div class="msg" id="loginMsg"></div>
        </div>
      </section>

      <!-- обратная сторона: отметка -->
      <section class="face back" id="punch">
        <div class="lift">
          <p class="hello" id="hello"></p>
          <p class="status"><span class="dot" id="dot"></span><span id="status"></span></p>
          <p class="timer hidden" id="timer"></p>
        </div>
        <div class="lift2 actions">
          <button class="btn3d big pulse" id="punchBtn"><span class="edge"></span><span class="front" id="punchLabel"></span></button>
          <button class="btn3d mid brk hidden" id="breakBtn"><span class="edge"></span><span class="front" id="breakLabel"></span></button>
        </div>
        <div class="lift">
          <button class="cardBtn" id="cardBtn">📊 Моя карточка: часы за день, неделю, месяц</button>
          <div class="geo">📸 Приход и уход — с селфи и местоположением<br>☕ Перерыв — одной кнопкой</div>
          <div class="msg" id="punchMsg"></div>
          <button class="link" id="logout">Выйти / другой сотрудник</button>
        </div>
      </section>
    </div>
  </div>
</main>

<script src="config.js?v=5"></script>
<script src="face.js?v=5"></script>
<script src="stats.js?v=5"></script>
<script>
const TZ = 'Asia/Samarkand';
let offset = 0;            // разница между часами сервера и телефона
let session = null;        // { employeeId, pin, name, last }
const $ = id => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- перекидные часы по Самарканду ----
const fTime = new Intl.DateTimeFormat('ru-RU', { timeZone: TZ, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
const fDate = new Intl.DateTimeFormat('ru-RU', { timeZone: TZ, weekday:'long', day:'numeric', month:'long', year:'numeric' });
const clockEl = $('clock'); const digits = [];
'00:00:00'.split('').forEach((ch, i) => {
  const el = document.createElement('span');
  if (ch === ':') { el.className = 'colon'; el.textContent = ':'; }
  else { el.className = 'digit' + (i >= 6 ? ' small' : ''); digits.push(el); }
  clockEl.appendChild(el);
});
let prev = '';
function tick() {
  const now = new Date(Date.now() + offset);
  const t = fTime.format(now).replace(/\D/g, '');
  for (let i = 0; i < 6; i++) {
    if (t[i] !== prev[i]) {
      const d = digits[i]; d.textContent = t[i];
      if (prev) { d.classList.remove('flip'); void d.offsetWidth; d.classList.add('flip'); }
    }
  }
  prev = t;
  if (session) updateTimer();
  const d = fDate.format(now); $('date').textContent = d.charAt(0).toUpperCase() + d.slice(1);
}
async function syncTime() {
  try { const t0 = Date.now(); const r = await callApi('time'); offset = r.ts - (t0 + Date.now()) / 2; } catch(e) {}
}
setInterval(tick, 1000); tick(); syncTime(); setInterval(syncTime, 5 * 60 * 1000);

// ---- наклон карточки за пальцем / мышкой ----
const tilt = $('tilt');
function setTilt(x, y) { if (!reduced) tilt.style.transform = `rotateX(${(-y * 10).toFixed(2)}deg) rotateY(${(x * 12).toFixed(2)}deg)`; }
function tiltFrom(e) {
  const r = tilt.getBoundingClientRect();
  setTilt(((e.clientX - r.left) / r.width - .5), ((e.clientY - r.top) / r.height - .5));
}
tilt.addEventListener('pointermove', tiltFrom);
tilt.addEventListener('pointerleave', () => setTilt(0, 0));
tilt.addEventListener('pointerup', () => setTilt(0, 0));

function api(action, body) { return callApi(action, body); }
function show(el, text, kind) { el.className = 'msg ' + kind; el.innerHTML = text; }
function hide(el) { el.className = 'msg'; }
function shake() { const f = $('flipper').classList.contains('flipped') ? $('punch') : $('login'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); }
function flipTo(back) { $('flipper').classList.toggle('flipped', back); }

// ---- 3D-монета и конфетти при успешной отметке ----
function celebrate(type, time) {
  const w = document.createElement('div'); w.className = 'win';
  const V = { in: ['✓', 'Приход отмечен', 'in'], out: ['👋', 'Хорошего отдыха!', 'out'],
              break_start: ['☕', 'Приятного перерыва', 'brk'], break_end: ['▶', 'С возвращением!', 'brk'] }[type];
  w.innerHTML = `<div class="coin ${V[2]}"><div class="side">${V[0]}</div><div class="side b">${V[0]}</div></div>
    <p>${V[1]} · ${time.slice(0, 5)}</p>`;
  document.body.appendChild(w);
  const colors = ['#3ee6a0', '#ffcf5a', '#ff6b57', '#7cc7ff', '#ffffff'];
  for (let i = 0; i < (reduced ? 0 : 40); i++) {
    const c = document.createElement('span'); c.className = 'conf';
    const a = Math.random() * Math.PI * 2, d = 140 + Math.random() * 220;
    c.style.setProperty('--x', Math.cos(a) * d + 'px'); c.style.setProperty('--y', Math.sin(a) * d - 80 + 'px');
    c.style.setProperty('--r', (Math.random() * 1080 - 540) + 'deg');
    c.style.background = colors[i % colors.length]; c.style.animationDelay = (Math.random() * .15) + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 1700);
  }
  const close = () => w.remove();
  w.onclick = close; setTimeout(close, 2200);
}

// ---- загрузка ----
(async () => {
  try {
    const info = await api('info');
    $('rname').textContent = info.restaurantName;
    document.title = 'Отметка — ' + info.restaurantName;
    const list = await api('employees');
    const sel = $('emp');
    sel.innerHTML = '<option value="">— выберите себя —</option>' + list.map(e => `<option value="${e.id}">${e.name.replace(/</g,'&lt;')}</option>`).join('');
    const saved = store.get('employeeId'); if (saved && list.some(e => e.id === saved)) sel.value = saved;
    if (!list.length) show($('loginMsg'), 'Сотрудники ещё не добавлены. Управляющему: откройте <a href="admin.html">панель</a>.', 'info');
  } catch (e) { show($('loginMsg'), e.message, 'err'); }
})();

// ---- вход ----
$('enter').onclick = async () => {
  const employeeId = $('emp').value, pin = $('pin').value.trim();
  if (!employeeId) { shake(); return show($('loginMsg'), 'Выберите себя в списке', 'err'); }
  if (!pin) { shake(); return show($('loginMsg'), 'Введите PIN-код', 'err'); }
  const label = $('enter').querySelector('.front');
  $('enter').disabled = true; label.textContent = 'Проверяем…';
  try {
    const r = await api('my_stats', { employeeId, pin });
    store.set('employeeId', employeeId);
    session = { employeeId, pin, name: r.name, last: r.last, records: r.records || [] };
    hide($('loginMsg')); hide($('punchMsg'));
    renderPunch();
    FaceCam.preload().catch(() => {});   // заранее грузим распознавание
    flipTo(true);
  } catch (e) { shake(); show($('loginMsg'), e.message, 'err'); }
  $('enter').disabled = false; label.textContent = 'Войти';
};
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('enter').click(); });

$('logout').onclick = () => {
  session = null; $('pin').value = '';
  flipTo(false);
};

function stateOf(last) { return !last || last.type === 'out' ? 'off' : last.type === 'break_start' ? 'break' : 'on'; }
function currentShift() { return TabelStats.build(session.records).find(x => x.current) || null; }
function updateTimer() {
  const el = $('timer'), cur = currentShift();
  if (!cur) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const sec = Math.floor(cur.netMs / 1000), h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, ss = sec % 60;
  el.innerHTML = `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}<small>чистое время смены${cur.breakMs ? ' · перерывы ' + TabelStats.fmt(cur.breakMs) : ''}</small>`;
}
function renderPunch() {
  const last = session.last, st = stateOf(last);
  $('hello').textContent = 'Здравствуйте, ' + session.name + '!';
  $('status').textContent = st === 'on' ? `На смене с ${(currentShift() || {}).in ? currentShift().in.time.slice(0,5) : last.time.slice(0,5)}`
    : st === 'break' ? `На перерыве с ${last.time.slice(0,5)}`
    : last ? `Последний уход: ${last.time.slice(0,5)} (${fmtDate(last.date)})` : 'Вы ещё не отмечались';
  $('dot').className = 'dot' + (st === 'on' ? ' on' : st === 'break' ? ' brk' : '');
  const b = $('punchBtn'), k = $('breakBtn');
  b.classList.toggle('hidden', st === 'break');
  b.className = 'btn3d big pulse' + (st === 'on' ? ' out' : '') + (st === 'break' ? ' hidden' : '');
  $('punchLabel').textContent = st === 'on' ? '🚪 Я ухожу' : '✅ Я пришёл(а)';
  b.dataset.type = st === 'on' ? 'out' : 'in';
  k.className = 'btn3d brk ' + (st === 'break' ? 'big pulse' : 'mid') + (st === 'off' ? ' hidden' : '');
  $('breakLabel').textContent = st === 'break' ? '▶ Закончить перерыв' : '☕ Начать перерыв';
  k.dataset.type = st === 'break' ? 'break_end' : 'break_start';
  updateTimer();
}
function fmtDate(d) { const [y,m,dd] = d.split('-'); return `${dd}.${m}.${y}`; }

// ---- геолокация ----
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('Телефон не поддерживает геолокацию'));
    navigator.geolocation.getCurrentPosition(resolve, err => {
      const m = { 1: 'Доступ к местоположению запрещён. Разрешите его в настройках браузера и попробуйте снова.',
                  2: 'Не удалось определить местоположение. Включите GPS.',
                  3: 'Слишком долго определяется местоположение. Попробуйте ещё раз.' };
      reject(new Error(m[err.code] || err.message));
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}

$('punchBtn').onclick = async () => {
  const b = $('punchBtn'), type = b.dataset.type;
  b.disabled = true; hide($('punchMsg'));
  const posP = getPosition();          // геолокация определяется, пока делается селфи
  posP.catch(() => {});
  try {
    const face = await FaceCam.capture(type === 'in' ? 'Селфи: отметка прихода' : 'Селфи: отметка ухода');
    show($('punchMsg'), '📍 Определяем местоположение и отправляем…', 'info');
    const pos = await posP;
    const { latitude: lat, longitude: lon, accuracy } = pos.coords;
    const r = await api('punch', { employeeId: session.employeeId, pin: session.pin, type, lat, lon, accuracy,
      descriptor: face.descriptor, photo: face.photo });
    session.last = r.record; session.records.push(r.record);
    const rec = r.record;
    let where = `<a href="https://maps.google.com/?q=${rec.lat},${rec.lon}" target="_blank">на карте</a>, точность ±${rec.accuracy ?? '?'} м`;
    if (rec.distance != null) where += rec.inside ? `<br>Вы у ресторана (${rec.distance} м)` : `<br>⚠️ Вы в ${rec.distance} м от ресторана`;
    where += rec.face === 'совпало' ? '<br>🙂 Лицо подтверждено' : '<br>📷 Селфи сохранено (образец лица ещё не задан управляющим)';
    show($('punchMsg'), `<b>${type === 'in' ? 'Приход' : 'Уход'} отмечен в ${rec.time}</b><br>${where}`, rec.inside === false ? 'err' : 'ok');
    celebrate(type, rec.time);
    renderPunch();
  } catch (e) { if (e.message !== 'Отменено') { shake(); show($('punchMsg'), e.message, 'err'); } }
  b.disabled = false;
};

// ---- перерыв: без селфи, одной кнопкой ----
$('breakBtn').onclick = async () => {
  const k = $('breakBtn'), type = k.dataset.type;
  k.disabled = true; hide($('punchMsg'));
  try {
    const r = await api('punch', { employeeId: session.employeeId, pin: session.pin, type });
    session.last = r.record; session.records.push(r.record);
    show($('punchMsg'), `<b>${type === 'break_start' ? 'Перерыв начат' : 'Перерыв закончен'} в ${r.record.time}</b>`, 'ok');
    celebrate(type, r.record.time);
    renderPunch();
  } catch (e) { shake(); show($('punchMsg'), e.message, 'err'); }
  k.disabled = false;
};

// ---- личная карточка ----
$('cardBtn').onclick = () => TabelStats.openCard(session.name, () => session.records);
</script>
